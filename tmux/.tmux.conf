set-option -g default-shell /opt/homebrew/bin/fish

# Change the background color for the status bar
set -g status-style bg=colour0,fg=colour7

# Let scroll work as scroll, not arrow
set -g mouse on

# Allow 3rd/image in nvim to work
set -g allow-passthrough on
# 让 nvim 收到 FocusGained/FocusLost，切 window 时 image.nvim 才能重发图片
set -g focus-events on
# image.nvim 的 tmux_show_only_in_active_window 依赖它关闭
set -g visual-activity off

# C-a is easier to hit than C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 设置窗口从1开始编号（默认是0）
set -g base-index 1
setw -g pane-base-index 1

# Renumber after a window is closed
set -g renumber-windows on
